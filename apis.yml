name: Radish Health
description: >-
  Radish Health is a healthcare company that provides employers with a modern
  employee health benefit, pairing each member with a dedicated care team and
  physicians who handle medical issues directly or coordinate specialist
  referrals. The service emphasizes direct-access primary care over phone,
  video, and in-person visits, with rapid response times and appointment
  coordination aimed at reducing employer healthcare costs while improving the
  patient experience. Radish Health is delivered through patient-facing web and
  mobile apps (iOS and Android) and an employer benefits program; it is a
  Techstars portfolio company. As of this enrichment pass, Radish Health
  publishes no public API, developer portal, or technical documentation — this
  profile captures its identity, legal/support surfaces, and domain security
  posture only.
